[project]
name = "oppsview-matcher"
version = "0.1.0"
description = "OppsView CV matcher: compares a CV with a job ad and lists matched and missing skills."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.18",  # file uploads in FastAPI
    "pypdf>=5.1",                # reading PDF CVs
    "python-docx>=1.1",          # reading Word CVs
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx2>=2.16",  # used by FastAPI's TestClient
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
matcher = ["skills.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
