# The skills OppsView recognises, and the different ways people write them.
#
# Each [[skill]] has:
#   name           how it's shown ("C#")
#   category       for grouping in the UI
#   aliases        other spellings, matched as whole words, ignoring case
#   case_sensitive aliases that only count in this exact case (for short,
#                  ambiguous ones like "Go", which is also an English word)
#   implies        skills you clearly have if you have this one
#                  (PostgreSQL implies SQL; ASP.NET Core implies C# and .NET)
#
# To add a skill, copy a block and edit it. No code changes needed.

