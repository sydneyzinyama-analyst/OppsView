# Builds the three container images and pushes them to GitHub's container
# registry (ghcr.io), on every push to main and on demand (Actions tab →
# Deploy → Run workflow). Azure Container Apps pulls the images from there.
#
#   ghcr.io/<owner>/oppsview-api       the API and the website
#   ghcr.io/<owner>/oppsview-matcher   the Python CV matcher
#   ghcr.io/<owner>/oppsview-notifier  the Java reminders worker
#
# Each image is tagged with the commit (sha-abc1234) and "latest".
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a newer one waits instead of cancelling a push halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # push to ghcr.io with the workflow's own token: no secret to manage

jobs:
  images:
    name: Image (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          # The API image also contains the website, so it builds from the repository root.
          - service: api
            context: .
            file: api/Dockerfile
          - service: matcher
            context: matcher
            file: matcher/Dockerfile
          - service: notifier
            context: notifier
            file: notifier/Dockerfile
    steps:
      - uses: actions/checkout@v5

      - name: Image name (registry names must be lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/oppsview-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
            ${{ steps.name.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Reuse layers from earlier builds (stored in GitHub's Actions cache).
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
